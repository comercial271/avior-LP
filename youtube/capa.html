<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;font-weight:300;src:url(../carrosseis/_render/fonts/Poppins-Light.ttf)}
@font-face{font-family:P;font-weight:400;src:url(../carrosseis/_render/fonts/Poppins-Regular.ttf)}
@font-face{font-family:P;font-weight:500;src:url(../carrosseis/_render/fonts/Poppins-Medium.ttf)}
@font-face{font-family:P;font-weight:600;src:url(../carrosseis/_render/fonts/Poppins-SemiBold.ttf)}
@font-face{font-family:P;font-weight:700;src:url(../carrosseis/_render/fonts/Poppins-Bold.ttf)}
*{margin:0;box-sizing:border-box}
body{width:2560px;height:1440px;background:#050505;overflow:hidden;font-family:P;position:relative;color:#F5F1E8}
.bg1{position:absolute;inset:0;background:
 radial-gradient(38% 60% at 78% 50%,rgba(214,188,142,.28) 0%,rgba(214,188,142,0) 70%),
 radial-gradient(30% 45% at 18% 30%,rgba(140,122,78,.18) 0%,rgba(0,0,0,0) 70%),
 radial-gradient(60% 80% at 50% 50%,#12100c 0%,#050505 80%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(194,184,157,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(194,184,157,.07) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(45% 55% at 72% 50%,#000 0%,transparent 80%)}
svg.orbit{position:absolute;left:1130px;top:220px}
.safe{position:absolute;left:507px;top:508px;width:1546px;height:423px}
.left{position:absolute;left:30px;top:0;bottom:0;width:900px;display:flex;flex-direction:column;justify-content:center}
.pill{align-self:flex-start;display:flex;align-items:center;gap:14px;padding:10px 22px;border:1px solid rgba(194,184,157,.45);border-radius:100px;font-size:20px;font-weight:500;letter-spacing:.22em;color:#D6BC8E;background:rgba(214,188,142,.06)}
.dot{width:10px;height:10px;border-radius:50%;background:#D6BC8E;box-shadow:0 0 14px #D6BC8E}
h1{margin-top:22px;font-weight:600;font-size:60px;line-height:1.08;white-space:nowrap;letter-spacing:-.015em}
h1 .g{background:linear-gradient(95deg,#F1DDB2 0%,#D6BC8E 45%,#A88E5C 100%);-webkit-background-clip:text;color:transparent}
p{margin-top:22px;font-weight:300;font-size:31px;line-height:1.35;color:#B9B3A6}
.right{position:absolute;right:10px;top:0;bottom:0;width:600px}
.card{position:absolute;background:linear-gradient(160deg,rgba(40,36,28,.92),rgba(16,15,12,.92));border:1px solid rgba(214,188,142,.3);border-radius:22px;box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.02) inset;padding:24px 28px}
.lab{font-size:15px;letter-spacing:.2em;font-weight:500;color:#8C8574;text-transform:uppercase}
.c1{left:0;top:30px;width:330px}
.bub{margin-top:14px;padding:14px 18px;border-radius:16px 16px 16px 4px;background:rgba(245,241,232,.07);font-size:18px;white-space:nowrap;color:#E7E2D6}
.bub.me{margin-left:70px;margin-right:0;display:table;border-radius:16px 16px 4px 16px;background:linear-gradient(95deg,#D6BC8E,#A88E5C);color:#0b0a08;font-weight:500}
.c2{right:0;top:10px;width:250px}
.flow{display:flex;align-items:center;gap:10px;margin-top:18px}
.n{width:46px;height:46px;border-radius:12px;border:1px solid rgba(214,188,142,.5);display:flex;align-items:center;justify-content:center;font-size:22px;color:#D6BC8E;background:rgba(214,188,142,.08)}
.ln{flex:1;height:2px;background:linear-gradient(90deg,#D6BC8E,rgba(214,188,142,.2))}
.c3{right:0;bottom:15px;width:290px}
.bars{display:flex;align-items:flex-end;gap:10px;height:70px;margin-top:16px}
.bars i{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#E9D3A6,#8C7A4E)}
.ok{margin-top:12px;white-space:nowrap;font-size:18px;color:#D6BC8E}
.brand{position:absolute;left:170px;top:130px;font-weight:300;font-size:40px;letter-spacing:.42em;color:#C2B89D}
.site{position:absolute;right:170px;bottom:110px;font-size:28px;letter-spacing:.2em;color:#8C8574}
.line{position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,transparent,#D6BC8E 30%,#D6BC8E 70%,transparent);opacity:.7}
</style></head><body>
<div class="bg1"></div><div class="grid"></div>
<svg class="orbit" width="1300" height="1000" viewBox="0 0 1300 1000" fill="none">
 <ellipse cx="650" cy="500" rx="600" ry="330" stroke="rgba(214,188,142,.22)" stroke-width="2"/>
 <ellipse cx="650" cy="500" rx="460" ry="420" stroke="rgba(214,188,142,.12)" stroke-width="2" transform="rotate(-25 650 500)"/>
 <ellipse cx="650" cy="500" rx="560" ry="200" stroke="rgba(214,188,142,.16)" stroke-width="2" stroke-dasharray="6 14" transform="rotate(18 650 500)"/>
 
 <circle cx="1170" cy="300" r="7" fill="#D6BC8E"/><circle cx="1050" cy="820" r="11" fill="#F1DDB2"/><circle cx="1050" cy="820" r="32" fill="rgba(214,188,142,.12)"/>
 <circle cx="380" cy="130" r="6" fill="#C2B89D"/>
</svg>
<div class="brand">AVIOR</div>
<div class="safe">
 <div class="left">
  <div class="pill"><span class="dot"></span>LABORATÓRIO DE IA</div>
  <h1>Experimentamos e criamos<br><span class="g">produtos com IA</span></h1>
  <p>para ajudar a resolver problemas<br>reais do seu negócio.</p>
 </div>
 <div class="right">
  <div class="card c1"><div class="lab">Agente de atendimento</div>
   <div class="bub">Quero um orçamento 👋</div><div class="bub me">Claro! Já te envio.</div></div>
  <div class="card c2"><div class="lab">Automação</div>
   <div class="flow"><div class="n">✉</div><div class="ln"></div><div class="n">⚙</div><div class="ln"></div><div class="n">✓</div></div></div>
  <div class="card c3"><div class="lab">Painel inteligente</div>
   <div class="bars"><i style="height:35%"></i><i style="height:52%"></i><i style="height:44%"></i><i style="height:70%"></i><i style="height:88%"></i><i style="height:100%"></i></div>
   <div class="ok">● Rodando no seu negócio</div></div>
 </div>
</div>
<div class="site">avior.ia.br</div><div class="line"></div>
</body></html>
