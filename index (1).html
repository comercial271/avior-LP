B\">86<\u002Fspan><\u002Fdiv>\n                          <div style=\"display: flex; justify-content: space-between\"><span>criada em<\u002Fspan><span style=\"color: #4B5266\">21/05/2026<\u002Fspan><\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"position: absolute; left: 0; top: 0; width: 1.7cqw; height: 2.4cqw; background: #FFFFFF; clip-path: polygon(0% 0%, 0% 78%, 26% 60%, 46% 100%, 62% 90%, 42% 52%, 74% 48%); filter: drop-shadow(0 0.3cqw 0.7cqw rgba(0,0,0,0.45)); animation: omRecCursor 18s ease-in-out infinite; pointer-events: none\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 20px; order: 2\">\n            <span style=\"font-size: 10px; letter-spacing: 0.3em; color: #8C8574; font-weight: 400\">RECRUTAMENTO COM IA<\u002Fspan>\n            <h3 style=\"margin: 0; font-weight: 200; font-size: clamp(26px, 3.2vw, 38px); line-height: 1.2; color: #F5F1E8; text-wrap: pretty\">Contratar deixou de depender de você<\u002Fh3>\n            <p style=\"margin: 0; max-width: 32em; font-size: clamp(15px, 1.5vw, 17px); line-height: 1.78; color: #8C8574; text-wrap: pretty\">A IA aplica prova e nota cada candidato antes de alguém do seu time olhar. Foram 311 candidatos avaliados em 18 vagas abertas, com o dono só decidindo no final.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding: clamp(76px, 10vw, 132px) clamp(20px, 5vw, 72px); background: #12100E; border-top: 1px solid rgba(186,177,150,0.14); border-bottom: 1px solid rgba(186,177,150,0.14)\">\n    <div style=\"max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: clamp(34px, 4.5vw, 52px)\">\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center\">\n        <span id=\"numeros\" style=\"display: block; position: relative; top: -110px\"><\u002Fspan><h2 style=\"margin: 0; font-weight: 200; font-size: clamp(28px, 3.8vw, 46px); line-height: 1.2; max-width: 26em; text-wrap: pretty\">A AVIOR em números reais<\u002Fh2>\n        <p style=\"margin: 0; max-width: 40em; font-size: clamp(15px, 1.5vw, 16.5px); line-height: 1.78; color: #8C8574; text-wrap: pretty\">O método não foi testado em cliente. Foi testado na minha folha, com mais de 100 pessoas dependendo de mim para receber no dia certo.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(172px, 1fr)); gap: clamp(26px, 3vw, 40px) clamp(16px, 2.1vw, 32px); padding: clamp(30px, 4vw, 54px) clamp(20px, 2.8vw, 40px); background: linear-gradient(160deg, rgba(194,184,157,0.09) 0%, rgba(0,0,0,0) 72%); border: 1px solid rgba(186,177,150,0.2); border-radius: 22px\">\n          <div style=\"min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; \">\n            <span style=\"font-size: 12px; letter-spacing: 0.1em; color: #8C8574\">Custo de mão de obra<\u002Fspan>\n            <span style=\"font-weight: 200; font-size: clamp(30px, 3.6vw, 46px); line-height: 1; white-space: nowrap; background: linear-gradient(100deg, #FFFBF0 0%, #C2B89D 48%, #BAB196 100%); -webkit-background-clip: text; background-clip: text; color: transparent\">R$ 50 mil<\u002Fspan>\n            <p style=\"margin: 0; max-width: 100%; font-size: 13.5px; line-height: 1.6; color: #8C8574; text-wrap: pretty\">a menos por mês, sem deixar de atender nenhum contrato que já estava na rua<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; \">\n            <span style=\"font-size: 12px; letter-spacing: 0.1em; color: #8C8574\">Custo de sistemas<\u002Fspan>\n            <span style=\"font-weight: 200; font-size: clamp(30px, 3.6vw, 46px); line-height: 1; white-space: nowrap; background: linear-gradient(100deg, #FFFBF0 0%, #C2B89D 48%, #BAB196 100%); -webkit-background-clip: text; background-clip: text; color: transparent\">R$ 8 mil<\u002Fspan>\n            <p style=\"margin: 0; max-width: 100%; font-size: 13.5px; line-height: 1.6; color: #8C8574; text-wrap: pretty\">a menos por mês, com licenças canceladas e o problema resolvido em casa<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; \">\n            <span style=\"font-size: 12px; letter-spacing: 0.1em; color: #8C8574\">Back office<\u002Fspan>\n            <span style=\"font-weight: 200; font-size: clamp(30px, 3.6vw, 46px); line-height: 1; white-space: nowrap; background: linear-gradient(100deg, #FFFBF0 0%, #C2B89D 48%, #BAB196 100%); -webkit-background-clip: text; background-clip: text; color: transparent\">14 para 5<\u002Fspan>\n            <p style=\"margin: 0; max-width: 100%; font-size: 13.5px; line-height: 1.6; color: #8C8574; text-wrap: pretty\">pessoas, e duas delas foram realocadas para o comercial. Foi realocação, não demissão<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; \">\n            <span style=\"font-size: 12px; letter-spacing: 0.1em; color: #8C8574\">Tempo de processo<\u002Fspan>\n            <span style=\"font-weight: 200; font-size: clamp(30px, 3.6vw, 46px); line-height: 1; white-space: nowrap; background: linear-gradient(100deg, #FFFBF0 0%, #C2B89D 48%, #BAB196 100%); -webkit-background-clip: text; background-clip: text; color: transparent\">2 semanas<\u002Fspan>\n            <p style=\"margin: 0; max-width: 100%; font-size: 13.5px; line-height: 1.6; color: #8C8574; text-wrap: pretty\">viraram 30 minutos em um processo que travava a operação inteira<\u002Fp>\n          <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p style=\"margin: 0; max-width: 46em; text-align: center; font-size: 12.5px; line-height: 1.7; color: rgba(140,133,116,0.8); text-wrap: pretty\">Números medidos dentro da FOCO, empresa de terceirização de serviços da própria fundadora. Resultados passados não garantem resultados futuros: cada operação tem o seu ponto de partida.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding: clamp(76px, 10vw, 132px) clamp(20px, 5vw, 72px)\">\n    <div style=\"max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(40px, 5vw, 58px)\">\n      <div style=\"display: flex; flex-direction: column; gap: 18px; max-width: 34em\">\n        <span id=\"cases\" style=\"display: block; position: relative; top: -110px\"><\u002Fspan><span style=\"font-size: 10px; letter-spacing: 0.34em; color: #BAB196; font-weight: 500\">O MAIOR CASE<\u002Fspan>\n        <h2 style=\"margin: 0; font-weight: 200; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.25; text-wrap: pretty\">Mais do que ter cases, a FOCO é o nosso maior case.<\u002Fh2>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.72; color: #8C8574; max-width: 40em; text-wrap: pretty\">Não foi uma área isolada. Foi a empresa inteira: DP, jurídico, RH, operação, marketing e administrativo, todos reconstruídos pelo mesmo método.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: clamp(28px, 3.5vw, 40px); padding: clamp(32px, 4vw, 48px); background: #12100E; border: 1px solid rgba(186,177,150,0.2); border-radius: 16px\">\n        <div style=\"display: flex; align-items: center; gap: 20px\">\n          <div style=\"position: relative; width: 52px; height: 52px; border-radius: 50%; overflow: hidden; background: #F5F1E8; padding: 6px\">\n            <image-slot id=\"avior-foco-logo\" shape=\"circle\" fit=\"contain\" placehol true }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 22px\">\n            <div style=\"display: flex; flex-direction: column; gap: 8px\">\n              <span style=\"font-size: 10px; letter-spacing: 0.28em; color: #BAB196; font-weight: 500\">DIAGNÓSTICO GRATUITO<\u002Fspan>\n              <h3 style=\"margin: 0; font-weight: 200; font-size: clamp(21px, 2.6vw, 26px); line-height: 1.25; color: #F5F1E8; text-wrap: pretty\">Antes de marcar, me conta rapidinho sobre a sua operação.<\u002Fh3>\n            <\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; gap: 10px\">\n              <span style=\"font-size: 11.5px; letter-spacing: 0.06em; color: #8C8574\">Faturamento mensal da empresa<\u002Fspan>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n                <button sc-camel-on-click=\"{{ setFat0 }}\" style=\"{{ fatStyle0 }}\">Até R$ 30 mil<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ setFat1 }}\" style=\"{{ fatStyle1 }}\">R$ 30 a 100 mil<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ setFat2 }}\" style=\"{{ fatStyle2 }}\">R$ 100 a 300 mil<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ setFat3 }}\" style=\"{{ fatStyle3 }}\">Acima de R$ 300 mil<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; gap: 10px\">\n              <span style=\"font-size: 11.5px; letter-spacing: 0.06em; color: #8C8574\">Tamanho da equipe<\u002Fspan>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n                <button sc-camel-on-click=\"{{ setEq0 }}\" style=\"{{ eqStyle0 }}\">Até 10<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ setEq1 }}\" style=\"{{ eqStyle1 }}\">11 a 30<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ setEq2 }}\" style=\"{{ eqStyle2 }}\">31 a 60<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ setEq3 }}\" style=\"{{ eqStyle3 }}\">Mais de 60<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; gap: 10px\">\n              <span style=\"font-size: 11.5px; letter-spacing: 0.06em; color: #8C8574\">Maior dor da operação hoje<\u002Fspan>\n              <div style=\"display: flex; flex-direction: column; gap: 8px\">\n                <button sc-camel-on-click=\"{{ setDor0 }}\" style=\"{{ dorStyle0 }}\">Time saindo e entrando toda hora<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ setDor1 }}\" style=\"{{ dorStyle1 }}\">Tudo passa por mim, não saio do centro<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ setDor2 }}\" style=\"{{ dorStyle2 }}\">Processo bagunçado, cada um faz de um jeito<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ setDor3 }}\" style=\"{{ dorStyle3 }}\">Quero usar IA mas não sei por onde começar<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; gap: 10px\">\n              <span style=\"font-size: 11.5px; letter-spacing: 0.06em; color: #8C8574\">Seus dados<\u002Fspan>\n              <input value=\"{{ leadNome }}\" sc-camel-on-change=\"{{ updateNome }}\" placeholder=\"Seu nome\" style=\"width: 100%; box-sizing: border-box; padding: 13px 14px; background: #16140F; border: 1px solid rgba(186,177,150,0.28); border-radius: 2px; color: #F5F1E8; font-size: 14px; font-family: Poppins, sans-serif\">\n              <input value=\"{{ leadWhats }}\" sc-camel-on-change=\"{{ updateWhats }}\" placeholder=\"WhatsApp com DDD\" style=\"width: 100%; box-sizing: border-box; padding: 13px 14px; background: #16140F; border: 1px solid rgba(186,177,150,0.28); border-radius: 2px; color: #F5F1E8; font-size: 14px; font-family: Poppins, sans-serif\">\n              <input value=\"{{ leadEmpresa }}\" sc-camel-on-change=\"{{ updateEmpresa }}\" placeholder=\"Nome da empresa\" style=\"width: 100%; box-sizing: border-box; padding: 13px 14px; background: #16140F; border: 1px solid rgba(186,177,150,0.28); border-radius: 2px; color: #F5F1E8; font-size: 14px; font-family: Poppins, sans-serif\">\n              <textarea value=\"{{ leadDescricao }}\" sc-camel-on-change=\"{{ updateDescricao }}\" placeholder=\"Conte um pouco sobre a empresa e o negócio\" rows=\"3\" style=\"width: 100%; box-sizing: border-box; padding: 13px 14px; background: #16140F; border: 1px solid rgba(186,177,150,0.28); border-radius: 2px; color: #F5F1E8; font-size: 14px; font-family: Poppins, sans-serif; resize: vertical\"><\u002Ftextarea>\n            <\u002Fdiv>\n\n            <button sc-camel-on-click=\"{{ submitLead }}\" disabled=\"{{ !canSubmit }}\" style=\"{{ submitStyle }}\">Quero conhecer mais<\u002Fbutton>\n            <span style=\"font-size: 11px; text-align: center; color: rgba(140,133,116,0.6)\">Suas respostas ajudam a gente a chegar preparado para a conversa.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ leadSubmitted }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; padding: 20px 0\">\n            <span style=\"font-size: 10px; letter-spacing: 0.28em; color: #BAB196; font-weight: 500\">RECEBIDO<\u002Fspan>\n            <h3 style=\"margin: 0; font-weight: 200; font-size: clamp(22px, 2.8vw, 27px); line-height: 1.3; color: #F5F1E8; text-wrap: pretty\">Parabéns, {{ leadFirstName }}. Nosso time irá entrar em contato com você.<\u002Fh3>\n            <p style=\"margin: 0; font-size: 14.5px; line-height: 1.7; color: #8C8574; max-width: 32em; text-wrap: pretty\">Com base no que você respondeu, já sabemos por onde começar a conversa.<\u002Fp>\n            <button sc-camel-on-click=\"{{ closeModal }}\" style=\"display: inline-flex; align-items: center; justify-content: center; padding: 18px 36px; border-radius: 1px; background: linear-gradient(100deg, #C2B89D 0%, #BAB196 60%, #A9A085 100%); color: #000000; font-weight: 500; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; width: 100%; box-sizing: border-box; border: none; font-family: Poppins, sans-serif; cursor: pointer\">Voltar para a página<\u002Fbutton>\n            <span style=\"font-size: 12px; color: rgba(140,133,116,0.65)\">Em breve alguém do time entra em contato pelo WhatsApp.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ stickyCta }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(0,0,0,0.94); backdrop-filter: blur(10px); border-top: 1px solid rgba(186,177,150,0.3)\">\n      <a href=\"#diagnostico\" sc-camel-on-click=\"{{ openModal }}\" style=\"display: flex; align-items: center; justify-content: center; padding: 17px 20px; border-radius: 1px; background: linear-gradient(100deg, #C2B89D, #BAB196); color: #000000; font-weight: 500; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase\">Quero conhecer mais<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"height: 78px\"><\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;mobileStickyCta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Conversão&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    narrow: false, modalOpen: false, leadSubmitted: false,\n    fat: null, eq: null, dor: null, leadNome: \"\", leadWhats: \"\", leadEmpresa: \"\", leadDescricao: \"\"\n  };\n\n  pillStyle(active) {\n    return \"padding: 10px 16px; border-radius: 999px; font-size: 12.5px; font-family: Poppins, sans-serif; cursor: pointer; text-align: left; transition: background 150ms ease, color 150ms ease, border-color 150ms ease; border: 1px solid \" +\n      (active ? \"#BAB196; background: #BAB196; color: #000000\" : \"rgba(186,177,150,0.3); background: transparent; color: #C2B89D\");\n  }\n\n  componentDidMount() {\n    this.mq = window.matchMedia(\"(max-width: 720px)\");\n    this.navMq = window.matchMedia(\"(min-width: 1024px)\");\n    this.onChange = () => this.setState({ narrow: this.mq.matches, navWide: this.navMq.matches });\n    this.onChange();\n    this.mq.addEventListener(\"change\", this.onChange);\n    this.navMq.addEventListener(\"change\", this.onChange);\n  }\n  componentWillUnmount() {\n    if (this.mq) this.mq.removeEventListener(\"change\", this.onChange);\n    if (this.navMq) this.navMq.removeEventListener(\"change\", this.onChange);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const canSubmit = s.fat !== null && s.eq !== null && s.dor !== null && s.leadNome.trim().length > 1 && s.leadWhats.trim().length > 7 && s.leadEmpresa.trim().length > 1;\n    return {\n      navWide: !!this.state.navWide,\n      stickyCta: (this.props.mobileStickyCta ?? true) && this.state.narrow,\n      modalOpen: s.modalOpen,\n      leadSubmitted: s.leadSubmitted,\n      leadNome: s.leadNome,\n      leadWhats: s.leadWhats,\n      leadEmpresa: s.leadEmpresa,\n      leadDescricao: s.leadDescricao,\n      leadFirstName: (s.leadNome.trim().split(\" \")[0]) || \"tudo certo\",\n      openModal: (e) => { e.preventDefault(); this.setState({ modalOpen: true }); },\n      closeModal: () => this.setState({ modalOpen: false, leadSubmitted: false }),\n      stopClick: (e) => e.stopPropagation(),\n      fatStyle0: this.pillStyle(s.fat === 0), fatStyle1: this.pillStyle(s.fat === 1),\n      fatStyle2: this.pillStyle(s.fat === 2), fatStyle3: this.pillStyle(s.fat === 3),\n      setFat0: () => this.setState({ fat: 0 }), setFat1: () => this.setState({ fat: 1 }),\n      setFat2: () => this.setState({ fat: 2 }), setFat3: () => this.setState({ fat: 3 }),\n      eqStyle0: this.pillStyle(s.eq === 0), eqStyle1: this.pillStyle(s.eq === 1),\n      eqStyle2: this.pillStyle(s.eq === 2), eqStyle3: this.pillStyle(s.eq === 3),\n      setEq0: () => this.setState({ eq: 0 }), setEq1: () => this.setState({ eq: 1 }),\n      setEq2: () => this.setState({ eq: 2 }), setEq3: () => this.setState({ eq: 3 }),\n      dorStyle0: this.pillStyle(s.dor === 0), dorStyle1: this.pillStyle(s.dor === 1),\n      dorStyle2: this.pillStyle(s.dor === 2), dorStyle3: this.pillStyle(s.dor === 3),\n      setDor0: () => this.setState({ dor: 0 }), setDor1: () => this.setState({ dor: 1 }),\n      setDor2: () => this.setState({ dor: 2 }), setDor3: () => this.setState({ dor: 3 }),\n      updateNome: (e) => this.setState({ leadNome: e.target.value }),\n      updateWhats: (e) => this.setState({ leadWhats: e.target.value }),\n      updateEmpresa: (e) => this.setState({ leadEmpresa: e.target.value }),\n      updateDescricao: (e) => this.setState({ leadDescricao: e.target.value }),\n      canSubmit,\n      submitStyle: \"padding: 17px 20px; border-radius: 1px; font-weight: 500; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; font-family: Poppins, sans-serif; border: none; width: 100%; \" +\n        (canSubmit\n          ? \"background: linear-gradient(100deg, #C2B89D 0%, #BAB196 60%, #A9A085 100%); color: #000000; cursor: pointer\"\n          : \"background: rgba(186,177,150,0.15); color: rgba(140,133,116,0.6); cursor: not-allowed\"),\n      submitLead: () => {\n        if (!canSubmit) return;\n        this.setState({ leadSubmitted: true });\n        const fatLabels = [\"Até R$ 30 mil\", \"R$ 30 a 100 mil\", \"R$ 100 a 300 mil\", \"Acima de R$ 300 mil\"];\n        const eqLabels = [\"Até 10\", \"11 a 30\", \"31 a 60\", \"Mais de 60\"];\n        const dorLabels = [\"Time saindo e entrando toda hora\", \"Tudo passa por mim, não saio do centro\", \"Processo bagunçado, cada um faz de um jeito\", \"Quero usar IA mas não sei por onde começar\"];\n        const payload = {\n          nome: s.leadNome, whatsapp: s.leadWhats, empresa: s.leadEmpresa, descricao: s.leadDescricao,\n          faturamento: fatLabels[s.fat], equipe: eqLabels[s.eq], dor: dorLabels[s.dor],\n          pagina: window.location.href\n        };\n        const SHEET_WEBHOOK_URL = \"https://script.google.com/macros/s/AKfycbycDvncU5ilhyH6Kq_P4cDa5xWWG_evF7K0c4ygae6JpYUKm3rrqr3m8L0HKEvGlLHscA/exec\";\n        if (SHEET_WEBHOOK_URL.indexOf(\"http\") === 0) {\n          fetch(SHEET_WEBHOOK_URL, { method: \"POST\", mode: \"no-cors\", headers: { \"Content-Type\": \"text/plain\" }, body: JSON.stringify(payload) }).catch(() => {});\n        } else {\n          console.warn(\"Configure SHEET_WEBHOOK_URL para enviar os leads para a planilha.\", payload);\n        }\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
